# HTTP сервер — редірект на HTTPS
server {
    listen 80;
    server_name host-176-36-217-137.b024.la.net.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl;
    server_name host-176-36-217-137.b024.la.net.ua;

    ssl_certificate /etc/letsencrypt/live/host-176-36-217-137.b024.la.net.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/host-176-36-217-137.b024.la.net.ua/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Front-end
    location / {
        proxy_pass http://front-end:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
